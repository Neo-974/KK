services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kk
      POSTGRES_USER: kk
      POSTGRES_PASSWORD: kk_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://kk:kk_dev_password@db:5432/kk
      JWT_SECRET_KEY: change-me-in-production
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  pgdata:
